<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exercise 11</title>
<style>
body {
background-color: #f4f4f4;
font-family: "Times New Roman", Georgia, serif;
padding: 30px;
}

.container {
background-color: #ffffff;
max-width: 800px;
margin: 0 auto;
padding: 25px 30px;
box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

.h1-style {
font-size: 36px;
font-weight: bold;
color: #222222;
margin: 10px 0 22px 25px;
text-decoration: overline;
}

.h2-style {
font-size: 24px;
font-style: italic;
font-weight: bold;
color: #222222;
border: 3px solid #cccc00;
padding: 4px 8px;
margin: 10px 0 28px 25px;
}

.h3-style {
font-size: 20px;
font-weight: bold;
color: #222222;
text-align: right;
text-decoration: underline;
margin: 10px 30px 10px 0;
}
</style>
</head>
<body>

<div class="container">
<div class="h1-style">This is heading 1</div>
<div class="h2-style">This is heading 2</div>
<div class="h3-style">This is heading 3</div>
</div>

</body>
</html>
